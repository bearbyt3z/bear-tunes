name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eyed3-compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum eyeD3 version supported by the display plugin replacement.
          - name: eyeD3 compatibility / Node.js 22.13.0 / eyeD3 minimal / Python 3.7.17
            node: '22.13.0'
            python: '3.7.17'
            requirements: python-requirements-minimal.txt

          - name: eyeD3 compatibility / Node.js 22.13.0 / eyeD3 project / Python 3.10.18
            node: '22.13.0'
            python: '3.10.18'
            requirements: python-requirements.txt

          - name: eyeD3 compatibility / Node.js 22.13.0 / eyeD3 latest / Python 3.14
            node: '22.13.0'
            python: '3.14'
            requirements: python-requirements-latest.txt

          - name: eyeD3 compatibility / Node.js LTS / eyeD3 project / Python 3.10.18
            node: 'lts'
            python: '3.10.18'
            requirements: python-requirements.txt

          - name: eyeD3 compatibility / Node.js Current / eyeD3 project / Python 3.10.18
            node: 'current'
            python: '3.10.18'
            requirements: python-requirements.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run eyeD3 compatibility test
        env:
          NODE_VERSION: ${{ matrix.node }}
          PYTHON_VERSION: ${{ matrix.python }}
          REQUIREMENTS_FILE: ${{ matrix.requirements }}
        run: ./scripts/eyed3-compatibility/run.sh

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Project checks / Node.js 22.13.0
            node: '22.13.0'

          - name: Project checks / Node.js LTS
            node: 'lts/*'

          - name: Project checks / Node.js Current
            node: 'current'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Upload coverage reports to Codecov
        if: matrix.node == '22.13.0'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
