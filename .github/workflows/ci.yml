name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  eyed3-compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum eyeD3 version supported by the display plugin replacement.
          - name: eyeD3 minimal / Python 3.7.17
            python: '3.7.17'
            requirements: python-requirements-minimal.txt

          - name: eyeD3 project / Python 3.10.18
            python: '3.10.18'
            requirements: python-requirements.txt

          - name: eyeD3 latest / Python 3.14
            python: '3.14'
            requirements: python-requirements-latest.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run eyeD3 compatibility test
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          REQUIREMENTS_FILE: ${{ matrix.requirements }}
        run: ./scripts/eyed3-compatibility/run.sh

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
